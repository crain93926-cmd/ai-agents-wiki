name: unpack
on:
  push:
    paths:
      - '*.zip'
      - 'download'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          f=$(ls *.zip download 2>/dev/null | head -1)
          mkdir /tmp/x
          unzip -q "$f" -d /tmp/x
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/x/ai-agents-wiki/. .
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project from zip"
          git push
